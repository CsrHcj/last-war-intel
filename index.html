  <style>
    :root {
      --bg: #0d131c;
      --panel: #151e2b;
      --panel-2: #1d2838;
      --border: #2b3a4f;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --silver: #cbd5e1;
      --bronze: #d97706;
      --tank: #4ade80;
      --air: #60a5fa;
      --missile: #f87171;
      --tbd: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 18px;
      line-height: 1.45;
    }

    .container { max-width: 1280px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 { font-size: 1.4rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.9rem; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
    }

    .stat-card .label { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; }
    .stat-card .val { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 10px;
      background: var(--panel);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    input, select {
      width: 100%;
      padding: 9px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 940px) {
      .layout { grid-template-columns: 1fr; }
    }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th, td {
      padding: 9px 11px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background: var(--panel-2);
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      position: sticky;
      top: 0;
    }

    tbody tr { cursor: pointer; transition: background 0.12s ease; }
    tbody tr:hover { background: rgba(56, 189, 248, 0.09); }
    tbody tr.active { background: rgba(56, 189, 248, 0.18); }

    .rank-1 { color: var(--gold); font-weight: 700; }
    .rank-2 { color: var(--silver); font-weight: 700; }
    .rank-3 { color: var(--bronze); font-weight: 700; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .sq-Tank { color: var(--tank); border-color: rgba(74, 222, 128, 0.35); }
    .sq-Aircraft { color: var(--air); border-color: rgba(96, 165, 250, 0.35); }
    .sq-Missile { color: var(--missile); border-color: rgba(248, 113, 113, 0.35); }
    .sq-TBD { color: var(--tbd); border-color: rgba(148, 163, 184, 0.35); }

    .inspector {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      position: sticky;
      top: 18px;
    }

    .inspector h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      word-break: break-word;
    }

    .field {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.2);
      font-size: 0.88rem;
    }

    .field span:first-child { color: var(--muted); }
    .field span:last-child { font-weight: 600; text-align: right; }

    .note-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 7px;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde68a;
      font-size: 0.84rem;
    }

    .empty-msg { color: var(--muted); font-size: 0.88rem; }
  </style>
</head>

    let selectedId = null;
    const fmtPower = (n) => n.toLocaleString("en-US");

    function populateFilters() {
      const serverSelect = document.getElementById("serverFilter");
      const servers = [...new Set(players.map((p) => p.server))].sort((a, b) => a - b);
      servers.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = String(s);
        opt.textContent = `Server #${s}`;
        serverSelect.appendChild(opt);
      });

      const countrySelect = document.getElementById("countryFilter");
      const countries = [...new Set(players.map((p) => p.nationality))].sort((a, b) => a.localeCompare(b));
      countries.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        countrySelect.appendChild(opt);
      });
    }

    function getFilteredPlayers() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const srv = document.getElementById("serverFilter").value;
      const sqd = document.getElementById("squadFilter").value;
      const cnt = document.getElementById("countryFilter").value;
      const sort = document.getElementById("sortSelect").value;

      let list = players.filter((p) => {
        const matchSrv = srv === "ALL" || String(p.server) === srv;
        const matchSqd = sqd === "ALL" || p.squad === sqd;
        const matchCnt = cnt === "ALL" || p.nationality === cnt;
        const matchText =
          !q ||
          p.name.toLowerCase().includes(q) ||
          p.alliance.toLowerCase().includes(q) ||
          p.nationality.toLowerCase().includes(q) ||
          String(p.server).includes(q) ||
          (p.note && p.note.toLowerCase().includes(q));
        return matchSrv && matchSqd && matchCnt && matchText;
      });

      if (sort === "powerDesc") {
        list.sort((a, b) => b.power - a.power);
      } else if (sort === "killsDesc") {
        list.sort((a, b) => b.killsNum - a.killsNum);
      } else {
        list.sort((a, b) => a.server - b.server || a.rank - b.rank);
      }

      return list;
    }

    function renderStats(list) {
      const statsBar = document.getElementById("statsBar");
      const total = list.length;
      const avgPower = total ? Math.round(list.reduce((acc, p) => acc + p.power, 0) / total) : 0;
      const counts = { Tank: 0, Aircraft: 0, Missile: 0 };
      list.forEach((p) => {
        if (counts[p.squad] !== undefined) counts[p.squad]++;
      });

      statsBar.innerHTML = `
        <div class="stat-card"><div class="label">Players Shown</div><div class="val">${total}</div></div>
        <div class="stat-card"><div class="label">Avg Power</div><div class="val">${total ? fmtPower(avgPower) : "-"}</div></div>
        <div class="stat-card"><div class="label">Tank Mains</div><div class="val" style="color:var(--tank)">${counts.Tank}</div></div>
        <div class="stat-card"><div class="label">Aircraft Mains</div><div class="val" style="color:var(--air)">${counts.Aircraft}</div></div>
        <div class="stat-card"><div class="label">Missile Mains</div><div class="val" style="color:var(--missile)">${counts.Missile}</div></div>
      `;
    }

    function renderInspector(p) {
      const box = document.getElementById("inspector");
      if (!p) {
        box.innerHTML = `<h2>Player Details</h2><p class="empty-msg">Tap or click a player row to inspect their full profile.</p>`;
        return;
      }

      box.innerHTML = `
        <h2>[${p.alliance}] ${p.name}</h2>
        <div class="field"><span>Server</span><span>#${p.server}</span></div>
        <div class="field"><span>Server Rank</span><span>#${p.rank}</span></div>
        <div class="field"><span>Power</span><span>${fmtPower(p.power)}</span></div>
        <div class="field"><span>Main Squad</span><span>${p.squad}</span></div>
        <div class="field"><span>Nationality</span><span>${p.nationality}</span></div>
        <div class="field"><span>Kills</span><span>${p.kills}</span></div>
        ${p.note ? `<div class="note-box"><strong>Intel Note:</strong> ${p.note}</div>` : ""}
      `;
    }

    function render() {
      const list = getFilteredPlayers();
      const tbody = document.getElementById("tableBody");
      document.getElementById("countLabel").textContent = `${list.length} player${list.length === 1 ? "" : "s"}`;
      renderStats(list);

      tbody.innerHTML = list
        .map((p) => {
          const id = `${p.server}-${p.rank}`;
          const activeClass = selectedId === id ? "active" : "";
          const rankClass = p.rank <= 3 ? `rank-${p.rank}` : "";
          return `
            <tr class="${activeClass}" data-id="${id}">
              <td>#${p.server}</td>
              <td class="${rankClass}">#${p.rank}</td>
              <td><strong>${p.name}</strong></td>
              <td>[${p.alliance}]</td>
              <td>${fmtPower(p.power)}</td>
              <td><span class="badge sq-${p.squad}">${p.squad}</span></td>
              <td>${p.nationality}</td>
              <td>${p.kills}</td>
            </tr>
          `;
        })
        .join("");

      tbody.querySelectorAll("tr").forEach((tr) => {
        tr.addEventListener("click", () => {
          const id = tr.getAttribute("data-id");
          selectedId = id;
          const found = players.find((x) => `${x.server}-${x.rank}` === id);
          renderInspector(found);
          render();
        });
      });
    }

    populateFilters();
    ["searchInput", "serverFilter", "squadFilter", "countryFilter", "sortSelect"].forEach((id) => {
      document.getElementById(id).addEventListener("input", render);
      document.getElementById(id).addEventListener("change", render);
    });

    render();
  </script>
